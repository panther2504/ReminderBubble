name: build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit + UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test tests/ReminderBubble.Tests/ReminderBubble.Tests.csproj --nologo
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: UI tests (quick-add parser + browser flows against the mock backend)
        working-directory: tests/ui
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test

  windows:
    name: Windows build + installer
    runs-on: windows-latest
    permissions:
      contents: write          # needed to attach files to a release when a v* tag is pushed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Publish + installer
        shell: pwsh
        run: ./build.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: ReminderBubble-Windows
          path: |
            dist/ReminderBubble-Setup-*.exe
            dist/ReminderBubble-win-x64.zip
      - name: Attach to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ReminderBubble-Setup-*.exe
            dist/ReminderBubble-win-x64.zip
