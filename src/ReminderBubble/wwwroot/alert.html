<!doctype html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self'">
  <title>Reminder due</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/alert.css">
</head>
<body>
<div class="alert app" id="alert">
  <div class="ambient" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
  <header class="ah" id="ah">
    <div class="bell" id="bell"></div>
    <div class="ht"><b id="aTitle">Reminder</b><span id="aSub">Right now</span></div>
    <button class="ibtn" id="aClose" title="Dismiss  ( Esc )" aria-label="Dismiss"></button>
  </header>
  <div class="alist" id="alist"></div>
  <footer class="afoot" id="afoot" hidden><button class="link" id="aOpen"></button></footer>
</div>
<script src="js/bridge.js"></script>
<script src="js/mock.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/alert.js"></script>
</body>
</html>
